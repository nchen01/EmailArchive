[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-knowledge-continuity"
version = "0.1.0"
description = "Email Knowledge Continuity — mailbox → structured knowledge graph (SaaS)"
requires-python = ">=3.11"
dependencies = [
    "ekc-schemas @ file:packages",  # local monorepo package; path relative to this file
    "pydantic>=2.0",
    "rapidfuzz>=3.0",
    "tldextract>=5.0",
    "html2text>=2024.2.26",
    "charset-normalizer>=3.3",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Production deployment extras — install only what a given service needs.
gmail = [
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
]
db = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# test: everything pytest needs to *collect and run the full suite*.
# db/api deps are included because tests import them at collection time;
# a bare pip install -e .[test] must work in CI without hidden extras.
test = [
    "pytest>=8.0",
    "pytest-timeout>=2.1",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# dev: one-shot local-development install (test suite + Gmail provider).
# Python extras cannot reference sibling extras portably, so deps are listed
# explicitly. Use: pip install -e packages/ && pip install -e .[dev]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.1",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]
exclude = ["tests*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests", "packages"]
