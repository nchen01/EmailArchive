[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-knowledge-continuity"
version = "0.1.0"
description = "Email Knowledge Continuity — mailbox → structured knowledge graph (SaaS)"
requires-python = ">=3.11"
dependencies = [
    "ekc-schemas @ file:packages",  # local monorepo package; path relative to this file
    "pydantic>=2.0",
    "rapidfuzz>=3.0",
    "tldextract>=5.0",
    "html2text>=2024.2.26",
    "charset-normalizer>=3.3",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Production deployment extras — install only what a given service needs.
gmail = [
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.2",  # InstalledAppFlow for the OAuth helper script
    "structlog>=24.0",   # structured JSON logging for the real-ingest runner
]
db = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# Clustering (L1 spec 03). spaCy is here; the en_core_web_sm *model* is NOT a
# pip dep — download it via scripts/download_models.py or `python -m spacy download`.
clustering = [
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "spacy>=3.7",
    "sentence-transformers>=3.0",
    "hnswlib>=0.8",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
]
# Synthesis (L3 + event extraction, spec 01 §7 / implementation-plan §4, S4).
# The Anthropic key is read from ANTHROPIC_API_KEY (D6) — never the DB or logs.
synthesis = [
    "anthropic>=0.40",
    "instructor>=1.3",
]
# test: everything pytest needs to *collect and run the full suite*.
# db/api deps are included because tests import them at collection time;
# a bare pip install -e .[test] must work in CI without hidden extras.
test = [
    "pytest>=8.0",
    "pytest-timeout>=2.1",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    # spacy library (not the model — download via scripts/download_models.py)
    "spacy>=3.7",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
    # Synthesis deps — tests import them at collection time (S4 Track B).
    "anthropic>=0.40",
    "instructor>=1.3",
    # Gmail deps — test_hardening.py mocks the service but GmailProvider still
    # does a lazy `from googleapiclient.errors import HttpError` in _with_backoff,
    # so these must be present for the full suite to pass under pip install -e .[test].
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "structlog>=24.0",
    # hnswlib is NOT here: requires MS C++ Build Tools on Windows and fails to
    # build without them.  blocking.py falls back to scikit-learn NearestNeighbors
    # automatically, so the full test suite passes without hnswlib.
    # Add pip install .[clustering] on Linux/prod where hnswlib builds cleanly.
]
# dev: one-shot local-development install (test suite + Gmail provider).
# Python extras cannot reference sibling extras portably, so deps are listed
# explicitly. Use: pip install -r requirements.txt
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.1",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.2",
    "structlog>=24.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "spacy>=3.7",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
    # Synthesis deps (S4 Track B).
    "anthropic>=0.40",
    "instructor>=1.3",
    # hnswlib excluded — see test extra comment above.
]

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]
exclude = ["tests*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests", "packages"]
