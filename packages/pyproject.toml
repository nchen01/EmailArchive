[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ekc-schemas"
version = "0.2.0"
description = "Shared data contracts for the Email Knowledge Continuity system"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ekc_schemas*"]
