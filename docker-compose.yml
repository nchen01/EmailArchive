services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ekc_dev
      POSTGRES_USER: ekc
      POSTGRES_PASSWORD: ekc_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekc -d ekc_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
